<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Siden findes ikke — Radich Coaching</title>
<meta name="description" content="Siden her findes ikke. Gå tilbage til forsiden hos Radich Coaching.">
<meta name="robots" content="noindex">
<style>
  /* Samme farver og skrift som resten af siden (Vintage Black + Yellow 500). Ingen fontfil hentes
     her — en fejlside skal være let og virke altid; systemets egen skrift er tæt nok på. */
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #0C0C0C; color: #FFFFFF; min-height: 100vh;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; padding: 32px;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  }
  .logo { color: #C4F501; font-size: 28px; font-weight: 900; letter-spacing: -0.03em; margin-bottom: 40px; }
  h1 { font-size: clamp(28px, 8vw, 44px); font-weight: 900; text-transform: uppercase; line-height: 1.05; letter-spacing: -0.02em; }
  p { color: #A3A3A3; font-size: 16px; line-height: 1.7; margin-top: 16px; max-width: 32rem; }
  a.knap {
    display: inline-block; margin-top: 32px; padding: 16px 32px; background: #C4F501; color: #0C0C0C;
    text-decoration: none; font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase; font-size: 14px;
  }
  a.knap:hover, a.knap:focus-visible { background: #A3CC00; }
  a.knap:focus-visible { outline: 2px solid #FFFFFF; outline-offset: 3px; }
</style>
</head>
<body>
  <main>
    <p class="logo">RC.</p>
    <h1>Siden findes ikke</h1>
    <p>Adressen er skrevet forkert, eller siden er flyttet. Du finder alt på forsiden.</p>
    <a class="knap" href="/">Til forsiden</a>
  </main>
</body>
</html>
